<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>Terminfinder</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Sichtbar, bis die App startet. Falls das Supabase-SDK nicht geladen
       werden kann (CDN blockiert, kein Netz), bleibt so wenigstens eine
       verständliche Meldung stehen statt einer leeren Seite. -->
  <section id="boot" class="boot">
    <div class="boot-logo">📅</div>
    <p id="boot-text">Wird geladen …</p>
  </section>

  <!-- ------------------------------------------------ Anmeldung / Account -->
  <section id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-logo">📅</div>
      <h1>Terminfinder</h1>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab is-active" data-mode="login" role="tab" aria-selected="true">Anmelden</button>
        <button type="button" class="auth-tab" data-mode="register" role="tab" aria-selected="false">Account anlegen</button>
      </div>

      <form id="auth-form" novalidate>
        <label for="auth-name">Name</label>
        <input id="auth-name" type="text" maxlength="40" required autocomplete="username" placeholder="z. B. Krümelmonster">

        <label for="auth-password">Passwort</label>
        <input id="auth-password" type="password" required autocomplete="current-password" placeholder="mindestens 8 Zeichen">

        <button type="submit" id="auth-submit" class="btn-primary">Anmelden</button>
        <p id="auth-status" class="status" role="status" aria-live="polite"></p>
        <p id="auth-hint" class="hint"></p>
      </form>
    </div>
  </section>

  <!-- ------------------------------------------------------------- Kalender -->
  <div id="app-view" class="app-view hidden">

    <header class="topbar">
      <button type="button" id="profile-btn" class="me" aria-label="Profilbild ändern">
        <span id="me-avatar"></span>
        <span id="me-name" class="me-name"></span>
      </button>
      <button type="button" id="logout-btn" class="btn-ghost">Abmelden</button>
    </header>

    <section id="profile-panel" class="card profile-panel hidden">
      <h3>Dein Profilbild</h3>
      <div id="emoji-choices" class="choice-grid"></div>
      <div id="color-choices" class="choice-grid color-grid"></div>
      <p id="profile-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <main class="app-main">

      <section class="card calendar-card">
        <div class="month-nav">
          <button type="button" id="prev-month" class="nav-btn" aria-label="Vorheriger Monat">‹</button>
          <h2 id="month-label"></h2>
          <button type="button" id="next-month" class="nav-btn" aria-label="Nächster Monat">›</button>
        </div>
        <button type="button" id="today-btn" class="btn-ghost today-btn">Heute</button>

        <div id="calendar-weekdays" class="calendar-weekdays"></div>
        <div id="calendar-grid" class="calendar-grid"></div>

        <p class="legend">
          <span class="legend-item"><span class="legend-dot mine"></span>Du hast Zeit</span>
          <span class="legend-item"><span class="legend-dot others"></span>Andere haben Zeit</span>
          <span class="legend-item">📝 Notiz</span>
        </p>
      </section>

      <section id="day-panel" class="card day-panel is-empty">
        <h3 id="day-title">Tippe einen Tag an</h3>

        <label class="switch">
          <input type="checkbox" id="available-toggle">
          <span class="switch-label">Ich habe Zeit</span>
        </label>

        <div id="time-fields" class="time-fields hidden">
          <label class="switch">
            <input type="checkbox" id="all-day-toggle" checked>
            <span class="switch-label">Ganzer Tag</span>
          </label>

          <div id="time-inputs" class="time-inputs hidden">
            <div class="time-field">
              <label for="start-time">Von</label>
              <input type="time" id="start-time">
            </div>
            <div class="time-field">
              <label for="end-time">Bis (optional)</label>
              <input type="time" id="end-time">
            </div>
          </div>
        </div>

        <label for="note-input">Notiz (sehen alle)</label>
        <textarea id="note-input" rows="2" maxlength="500" placeholder="z. B. erst ab 19 Uhr, oder: bin im Urlaub"></textarea>
        <p id="note-counter" class="counter">0/500</p>

        <button type="button" id="save-day-btn" class="btn-primary">Speichern</button>
        <p id="day-status" class="status" role="status" aria-live="polite"></p>

        <div id="day-people" class="day-people"></div>
      </section>

      <section class="card">
        <h3>🏆 Da haben die meisten Zeit</h3>
        <p id="ranking-empty" class="muted hidden">Noch hat sich niemand eingetragen. Mach den Anfang!</p>
        <ol id="ranking-list" class="ranking-list"></ol>
      </section>

    </main>
  </div>

  <!-- Klassisches Script (kein Modul): läuft auch dann, wenn das Modul
       oben gar nicht erst geladen werden kann. -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        var boot = document.getElementById('boot');
        if (!boot || boot.classList.contains('hidden')) return;
        document.getElementById('boot-text').textContent =
          'Die App konnte nicht geladen werden. Bitte prüfe deine Internetverbindung ' +
          'und lade die Seite neu.';
        boot.classList.add('boot-error');
      }, 8000);
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
