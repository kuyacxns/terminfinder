# Supabase-Projektkonfiguration.
#
# Diese Datei macht das Verzeichnis `supabase/` als gültiges
# Supabase-Projekt erkennbar – für die Supabase CLI (`supabase link`,
# `supabase db push`, `supabase migration new`, lokale Function-Tests,
# ...) sowie für die optionale GitHub-Integration (Supabase-Dashboard ->
# Project Settings -> Integrations -> GitHub Connection), die vor allem
# Preview-Branches für Pull Requests einrichtet. Migrationen in
# supabase/migrations/ werden dadurch NICHT automatisch in die
# Produktionsdatenbank übernommen – dafür weiterhin `supabase db push`
# (oder das manuelle Ausführen im SQL Editor) nutzen, siehe README.md.
#
# Dieses Projekt nutzt bewusst KEINEN lokalen Supabase-Stack (kein
# `supabase start` / Docker) – lokal wird direkt gegen dein gehostetes
# Supabase-Projekt getestet, siehe README.md, Abschnitt "Lokal testen".
# Die Konfiguration ist deshalb absichtlich minimal gehalten.

project_id = "terminfinder"

[db]
major_version = 15
